<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connexion — Qoria</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="brand" style="margin-bottom:1rem">
        <img src="/logo.jpg" alt="" width="36" height="36" />
        <span>Qoria</span>
      </div>
      <h1>Connexion</h1>
      <p class="sub">Bon retour. Continuons.</p>
      <form id="form">
        <div class="field"><label>Courriel</label><input type="email" id="email" required autocomplete="email" /></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="password" required autocomplete="current-password" /></div>
        <div class="err" id="err"></div>
        <button class="btn btn-primary" type="submit">Se connecter</button>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:.9rem">Pas de compte ? <a href="/signup.html">Créer un compte</a></p>
    </div>
  </div>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email.value.trim(),
            password: password.value
          })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Erreur');
        if (d.token) localStorage.setItem('qoria_token', d.token);
        location.href = '/app.html';
      } catch (ex) { err.textContent = ex.message; }
    };
  </script>
</body>
</html>
