<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="title.login">Connexion — Qoria</title>
  <meta name="theme-color" content="#05060b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/i18n.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/" style="margin-bottom:1.15rem;display:inline-flex">
        <img src="/logo.jpg" alt="Qoria" width="38" height="38" />
        <span>Qoria</span>
      </a>
      <h1 data-i18n="login.h1">Bon retour</h1>
      <p class="sub" data-i18n="login.sub">Reconnecte-toi pour continuer où tu étais.</p>
      <form id="form">
        <div class="field"><label data-i18n="login.email">Courriel</label><input type="email" id="email" required autocomplete="email" inputmode="email" /></div>
        <div class="field"><label data-i18n="login.password">Mot de passe</label><input type="password" id="password" required autocomplete="current-password" /></div>
        <div class="err" id="err"></div>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">Se connecter</button>
      </form>
      <p style="margin-top:1.15rem;color:var(--muted);font-size:.9rem;text-align:center" data-i18n-html="login.footer">Pas de compte ? <a href="/signup.html">Créer un compte</a></p>
    </div>
  </div>
  <script src="/js/sw-boot.js" defer></script>
</body>
</html>
