<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Créer un compte — Qoria</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="brand" style="margin-bottom:1rem">
        <img src="/logo.jpg" alt="" width="36" height="36" />
        <span>Qoria</span>
      </div>
      <h1>Créer un compte</h1>
      <p class="sub">Gratuit · chat illimité · 3 images / jour</p>
      <form id="form">
        <div class="field"><label>Prénom</label><input id="name" autocomplete="name" placeholder="Lucas" /></div>
        <div class="field"><label>Courriel</label><input type="email" id="email" required autocomplete="email" /></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="password" required minlength="6" autocomplete="new-password" /></div>
        <div class="err" id="err"></div>
        <button class="btn btn-primary" type="submit">Commencer avec Qoria</button>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:.9rem">Déjà inscrit ? <a href="/login.html">Connexion</a></p>
    </div>
  </div>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const val = (id) => ((document.getElementById(id) || {}).value || '');
      try {
        const r = await fetch('/api/auth/signup', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: val('name').trim(),
            email: val('email').trim(),
            password: val('password')
          })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Erreur');
        if (d.token) localStorage.setItem('qoria_token', d.token);
        location.href = '/app.html';
      } catch (ex) { err.textContent = ex.message; }
    };
  </script>
</body>
</html>
