<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="title.signup">Créer un compte — Qoria</title>
  <meta name="theme-color" content="#05060b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/i18n.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="/" style="margin-bottom:1.15rem;display:inline-flex">
        <img src="/logo.jpg" alt="Qoria" width="38" height="38" />
        <span>Qoria</span>
      </a>
      <h1 data-i18n="signup.h1">Créer un compte</h1>
      <p class="sub" data-i18n="signup.sub">Gratuit · chat illimité · 3 images / jour · 1 vidéo / jour. Pro plus tard si tu veux aller plus loin.</p>
      <form id="form">
        <div class="field"><label data-i18n="signup.name">Prénom</label><input id="name" autocomplete="name" placeholder="Lucas" /></div>
        <div class="field"><label data-i18n="signup.email">Courriel</label><input type="email" id="email" required autocomplete="email" inputmode="email" /></div>
        <div class="field"><label data-i18n="signup.password">Mot de passe</label><input type="password" id="password" required minlength="6" autocomplete="new-password" /></div>
        <div class="err" id="err"></div>
        <button class="btn btn-primary" type="submit" data-i18n="signup.submit">Commencer avec Qoria</button>
      </form>
      <p style="margin-top:1.15rem;color:var(--muted);font-size:.9rem;text-align:center" data-i18n-html="signup.footer">Déjà inscrit ? <a href="/login.html">Connexion</a></p>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const val = (id) => ((document.getElementById(id) || {}).value || '');
      const t = (k) => (window.QoriaI18n && QoriaI18n.t(k)) || k;
      try {
        const r = await fetch('/api/auth/signup', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: val('name').trim(),
            email: val('email').trim(),
            password: val('password')
          })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || t('signup.err'));
        if (d.token) localStorage.setItem('qoria_token', d.token);
        location.href = '/app.html';
      } catch (ex) { err.textContent = ex.message; }
    };
  </script>
</body>
</html>
