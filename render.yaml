services:
  - type: web
    name: qoria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FREE_DAILY_IMAGES
        value: "3"
      - key: FREE_DAILY_VIDEOS
        value: "1"
      - key: ENSEMBLE_DAILY_CAP
        value: "10"
      - key: CHAT_MAX_TOKENS
        value: "1200"
      - key: VISION_MAX_TOKENS
        value: "600"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_OWN_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_BASE_URL
        sync: false
      - key: IMAGE_MODEL
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_MODEL
        value: flux
      - key: TAVILY_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: VIDEO_PROVIDER
        sync: false
      - key: FAL_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: LUMA_API_KEY
        sync: false
      - key: VIDEO_API_KEY
        sync: false
      - key: VIDEO_API_URL
        sync: false
      - key: VIDEO_MODEL
        sync: false
      - key: VIDEO_DURATION
        value: "5"
